[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfvpn"
version = "0.1.0"
description = "NoFlagVPN — a censorship-resistant, traffic-shaped peer-to-peer tunnel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NoFlagVPN contributors" }]
keywords = ["vpn", "censorship-circumvention", "chacha20", "x25519", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security :: Cryptography",
]
# No runtime dependencies by design — see requirements.txt.
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=42.0"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "cryptography>=42.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
nfvpn = "nfvpn.cli.main:main"

[project.urls]
Homepage = "https://github.com/codero-sus/NoFlagVPN"

[tool.setuptools.packages.find]
include = ["nfvpn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=120"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:nfvpn.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["nfvpn", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
  "E501",   # long lines are fine when they carry a docstring/verbatim spec
  "RUF001", # the docs use typographic dashes and quotes on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802", "N803"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
files = ["nfvpn", "updater.py", "tools"]
